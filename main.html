<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PUTTUS-AI Pair Code</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 360px;
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);
    }

    h1 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    p {
      color: #777;
      font-size: 14px;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #result {
      margin-top: 20px;
      font-size: 14px;
    }

    .code {
      margin-top: 10px;
      padding: 15px;
      background: #f1f1f1;
      border-radius: 8px;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 4px;
      user-select: all;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>PUTTUS-AI</h1>

    <p>WhatsApp Pair Code Generator</p>

    <input
      id="number"
      type="tel"
      placeholder="919876543210"
    >

    <button id="btn" onclick="generateCode()">
      Generate Pair Code
    </button>

    <div id="result"></div>

  </div>

  <script>
    async function generateCode() {

      const number =
        document.getElementById("number")
          .value
          .replace(/\D/g, "");

      const button =
        document.getElementById("btn");

      const result =
        document.getElementById("result");

      if (!number) {
        result.innerHTML =
          "Please enter your WhatsApp number.";
        return;
      }

      button.disabled = true;
      button.innerText = "Generating...";
      result.innerHTML = "Please wait...";

      try {

        const response = await fetch(
          "/pair?number=" +
          encodeURIComponent(number)
        );

        const data = await response.json();

        if (data.code) {

          result.innerHTML = `
            <div>Your Pair Code</div>

            <div class="code">
              ${data.code}
            </div>
          `;

        } else {

          result.innerHTML =
            data.message ||
            "Pair code generation failed.";

        }

      } catch (error) {

        result.innerHTML =
          "Server connection failed.";

      }

      button.disabled = false;
      button.innerText = "Generate Pair Code";
    }
  </script>

</body>
</html>
