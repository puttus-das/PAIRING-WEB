<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>PUTTUS-DAS SESSION</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />

  <style>
    :root {
      --primary: #667eea;
      --secondary: #764ba2;
      --text: #ffffff;
      --muted: rgba(255,255,255,0.6);
      --success: #4ade80;
      --danger: #ff6b6b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family:
        Inter,
        "SF Pro Display",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 15px;

      color: var(--text);

      background:
        radial-gradient(
          circle at top left,
          rgba(102,126,234,0.35),
          transparent 35%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(118,75,162,0.35),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #0f0c29,
          #302b63,
          #24243e
        );

      overflow-x: hidden;
    }

    /* Background particles */

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      z-index: -1;
    }

    body::before {
      background: #667eea;
      top: -100px;
      left: -100px;
    }

    body::after {
      background: #f5576c;
      right: -100px;
      bottom: -100px;
    }

    /* Main Card */

    .container {
      width: 100%;
      max-width: 450px;

      padding: 30px;

      background: rgba(255,255,255,0.035);

      border: 1px solid rgba(255,255,255,0.08);

      border-radius: 25px;

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      box-shadow:
        0 25px 70px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.08);

      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: "";

      position: absolute;

      top: 0;
      left: 0;
      right: 0;

      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,0.4),
          transparent
        );
    }

    /* Header */

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 82px;
      height: 82px;

      margin: 0 auto 18px;

      border-radius: 22px;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 34px;

      background:
        linear-gradient(
          135deg,
          #667eea,
          #764ba2
        );

      box-shadow:
        0 15px 40px rgba(102,126,234,0.4),
        inset 0 1px 1px rgba(255,255,255,0.3);

      transition: 0.4s ease;
    }

    .logo:hover {
      transform: translateY(-4px) scale(1.05) rotate(3deg);
    }

    .title {
      font-size: 29px;
      font-weight: 800;

      background:
        linear-gradient(
          135deg,
          #ffffff,
          #a5b4fc,
          #c084fc
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      margin-bottom: 7px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.3px;
    }

    /* Social */

    .social-icons {
      display: flex;
      justify-content: center;

      gap: 13px;

      margin-top: 20px;
      margin-bottom: 25px;
    }

    .social-icons a {
      width: 46px;
      height: 46px;

      display: flex;
      justify-content: center;
      align-items: center;

      border-radius: 14px;

      text-decoration: none;

      font-size: 18px;

      background: rgba(255,255,255,0.05);

      border: 1px solid rgba(255,255,255,0.08);

      transition: 0.3s ease;
    }

    .social-icons a:hover {
      transform: translateY(-4px) scale(1.05);
      background: rgba(255,255,255,0.1);
    }

    .youtube {
      color: #ff0000;
    }

    .facebook {
      color: #1877f2;
    }

    .whatsapp {
      color: #25d366;
    }

    .github {
      color: #ffffff;
    }

    /* Toggle */

    .toggle-container {
      display: flex;

      padding: 5px;

      margin-bottom: 25px;

      border-radius: 16px;

      background: rgba(255,255,255,0.035);

      border: 1px solid rgba(255,255,255,0.07);
    }

    .toggle-option {
      flex: 1;

      padding: 14px 10px;

      text-align: center;

      border-radius: 12px;

      cursor: pointer;

      font-size: 14px;
      font-weight: 600;

      color: rgba(255,255,255,0.5);

      transition: 0.3s ease;
    }

    .toggle-option i {
      margin-right: 7px;
    }

    .toggle-option.active {
      color: #fff;

      background:
        linear-gradient(
          135deg,
          #667eea,
          #764ba2
        );

      box-shadow:
        0 5px 18px rgba(102,126,234,0.3);
    }

    /* Input */

    .input-group {
      margin-bottom: 20px;
    }

    .input-label {
      display: block;

      margin-bottom: 9px;

      font-size: 14px;
      font-weight: 600;

      color: rgba(255,255,255,0.8);
    }

    .input-field {
      width: 100%;

      padding: 16px 18px;

      border-radius: 15px;

      border: 1px solid rgba(255,255,255,0.1);

      background: rgba(255,255,255,0.04);

      color: #fff;

      font-size: 15px;

      outline: none;

      transition: 0.3s ease;
    }

    .input-field::placeholder {
      color: rgba(255,255,255,0.3);
    }

    .input-field:focus {
      border-color: rgba(102,126,234,0.8);

      box-shadow:
        0 0 0 3px rgba(102,126,234,0.12);

      background: rgba(255,255,255,0.06);
    }

    /* Generate Button */

    .generate-btn {
      width: 100%;

      padding: 17px;

      border: none;
      border-radius: 15px;

      cursor: pointer;

      color: white;

      font-size: 15px;
      font-weight: 700;

      background:
        linear-gradient(
          135deg,
          #667eea,
          #764ba2
        );

      box-shadow:
        0 10px 30px rgba(102,126,234,0.25);

      transition: 0.3s ease;
    }

    .generate-btn:hover {
      transform: translateY(-3px);

      box-shadow:
        0 15px 35px rgba(102,126,234,0.4);
    }

    .generate-btn:active {
      transform: scale(0.98);
    }

    .generate-btn.hidden {
      display: none;
    }

    /* Loading */

    .loading {
      display: none;

      text-align: center;

      margin: 20px 0;
    }

    .loading i {
      font-size: 28px;

      background:
        linear-gradient(
          135deg,
          #667eea,
          #c084fc
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Code Display */

    .code-display {
      width: 100%;

      min-height: 65px;

      margin-top: 20px;

      padding: 18px;

      display: flex;

      align-items: center;
      justify-content: center;

      text-align: center;

      border-radius: 16px;

      background: rgba(255,255,255,0.035);

      border: 1px solid rgba(255,255,255,0.08);

      font-family:
        "Courier New",
        monospace;

      font-size: 18px;

      letter-spacing: 2px;
    }

    .success-message {
      color: var(--success);

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 10px;

      font-size: 18px;
      font-weight: 700;
    }

    .error-message {
      color: var(--danger);

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 10px;

      font-size: 14px;
    }

    /* QR */

    .qr-display {
      display: none;

      margin-top: 20px;

      padding: 25px;

      text-align: center;

      border-radius: 18px;

      background: rgba(255,255,255,0.04);

      border: 1px solid rgba(255,255,255,0.08);
    }

    .qr-image {
      width: 260px;
      max-width: 100%;

      padding: 12px;

      background: #fff;

      border-radius: 15px;

      box-shadow:
        0 15px 35px rgba(0,0,0,0.35);
    }

    .qr-instructions {
      margin-top: 15px;

      color: rgba(255,255,255,0.65);

      font-size: 13px;

      line-height: 1.6;
    }

    /* Copy */

    .copy-btn {
      width: 100%;

      padding: 15px;

      margin-top: 18px;

      border-radius: 15px;

      border: 1px solid rgba(255,255,255,0.1);

      background: rgba(255,255,255,0.05);

      color: rgba(255,255,255,0.85);

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;

      transition: 0.3s ease;
    }

    .copy-btn:hover {
      background: rgba(255,255,255,0.1);

      transform: translateY(-2px);
    }

    /* Footer */

    .footer {
      text-align: center;

      margin-top: 25px;
      padding-top: 18px;

      border-top:
        1px solid rgba(255,255,255,0.06);

      color: rgba(255,255,255,0.35);

      font-size: 11px;

      letter-spacing: 0.4px;
    }

    /* Mobile */

    @media (max-width: 480px) {

      body {
        padding: 10px;
      }

      .container {
        padding: 24px 20px;
        border-radius: 22px;
      }

      .logo {
        width: 72px;
        height: 72px;

        font-size: 29px;
      }

      .title {
        font-size: 25px;
      }

      .qr-image {
        width: 230px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- HEADER -->

    <div class="header">

      <div class="logo">
        <i class="fas fa-robot"></i>
      </div>

      <h1 class="title">
        PUTTUS-DAS
      </h1>

      <p class="subtitle">
        Link your WhatsApp device
      </p>

      <!-- SOCIAL LINKS -->

      <div class="social-icons">

        <a
          href="https://youtube.com/@pabitra_paul-31"
          target="_blank"
          class="youtube"
          aria-label="YouTube"
        >
          <i class="fab fa-youtube"></i>
        </a>

        <a
          href="https://www.facebook.com/"
          target="_blank"
          class="facebook"
          aria-label="Facebook"
        >
          <i class="fab fa-facebook"></i>
        </a>

        <a
          href="https://wa.me/"
          target="_blank"
          class="whatsapp"
          aria-label="WhatsApp"
        >
          <i class="fab fa-whatsapp"></i>
        </a>

        <a
          href="https://github.com/puttus-das/PUTTUS-AI"
          target="_blank"
          class="github"
          aria-label="GitHub"
        >
          <i class="fab fa-github"></i>
        </a>

      </div>

    </div>


    <!-- MODE TOGGLE -->

    <div class="toggle-container">

      <div
        class="toggle-option active"
        data-mode="pair"
      >
        <i class="fas fa-key"></i>
        Pair Code
      </div>

      <div
        class="toggle-option"
        data-mode="qr"
      >
        <i class="fas fa-qrcode"></i>
        QR Code
      </div>

    </div>


    <!-- NUMBER INPUT -->

    <div
      class="input-group"
      id="inputGroup"
    >

      <label class="input-label">
        Enter your WhatsApp number with country code
      </label>

      <input
        type="tel"
        id="mobileNumber"
        class="input-field"
        placeholder="+917679218662"
        autocomplete="tel"
      />

    </div>


    <!-- GENERATE BUTTON -->

    <button
      class="generate-btn"
      id="submit"
      type="button"
    >
      <i class="fas fa-key"></i>
      Generate Pair Code
    </button>


    <!-- LOADING -->

    <div
      class="loading"
      id="loading"
    >
      <i class="fas fa-spinner"></i>
    </div>


    <!-- CODE -->

    <div
      class="code-display"
      id="codeDisplay"
    >
      Your pair code will appear here
    </div>


    <!-- QR -->

    <div
      class="qr-display"
      id="qrDisplay"
    >

      <img
        id="qrImage"
        class="qr-image"
        src=""
        alt="WhatsApp QR Code"
      />

      <div
        class="qr-instructions"
        id="qrInstructions"
      >
        Scan this QR code with your WhatsApp app.
      </div>

    </div>


    <!-- COPY -->

    <button
      class="copy-btn"
      id="copy"
      type="button"
    >
      <i class="fas fa-copy"></i>
      Copy Code
    </button>


    <!-- FOOTER -->

    <div class="footer">
      <p>
        © 2026 PUTTUS-BOT. All rights reserved.
      </p>
    </div>

  </div>


  <!-- AXIOS -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.8/axios.min.js"></script>


  <script>

    let currentMode = "pair";
    let currentPairCode = "";


    /* =========================
       TOGGLE
    ========================= */

    document
      .querySelectorAll(".toggle-option")
      .forEach(option => {

        option.addEventListener("click", function () {

          const mode = this.dataset.mode;

          if (mode === currentMode) {
            return;
          }

          document
            .querySelectorAll(".toggle-option")
            .forEach(opt => {
              opt.classList.remove("active");
            });

          this.classList.add("active");

          currentMode = mode;

          const submit =
            document.getElementById("submit");

          const inputGroup =
            document.getElementById("inputGroup");

          const codeDisplay =
            document.getElementById("codeDisplay");

          const qrDisplay =
            document.getElementById("qrDisplay");


          currentPairCode = "";

          codeDisplay.innerHTML =
            "Your pair code will appear here";

          codeDisplay.style.display = "flex";

          qrDisplay.style.display = "none";


          if (mode === "pair") {

            submit.classList.remove("hidden");

            inputGroup.classList.remove("hidden");

            submit.innerHTML =
              '<i class="fas fa-key"></i> Generate Pair Code';

          } else {

            submit.classList.add("hidden");

            inputGroup.classList.add("hidden");

            generateQRCode();

          }

        });

      });


    /* =========================
       PAIR CODE
    ========================= */

    document
      .getElementById("submit")
      .addEventListener("click", async function () {

        const numberInput =
          document.getElementById("mobileNumber");

        const codeDisplay =
          document.getElementById("codeDisplay");

        const qrDisplay =
          document.getElementById("qrDisplay");

        const loading =
          document.getElementById("loading");


        let number =
          numberInput.value.trim();


        number =
          number.replace(/[^0-9]/g, "");


        if (!number) {

          codeDisplay.innerHTML = `
            <div class="error-message">
              <i class="fas fa-exclamation-circle"></i>
              Please enter your WhatsApp number
            </div>
          `;

          return;
        }


        if (
          number.length < 10 ||
          number.length > 15
        ) {

          codeDisplay.innerHTML = `
            <div class="error-message">
              <i class="fas fa-exclamation-circle"></i>
              Invalid WhatsApp number
            </div>
          `;

          return;
        }


        loading.style.display = "block";

        qrDisplay.style.display = "none";

        codeDisplay.style.display = "flex";

        codeDisplay.innerHTML = `
          <div>
            <i class="fas fa-spinner fa-spin"></i>
            Generating pairing code...
          </div>
        `;


        try {

          const response =
            await axios.get(
              `/pair?number=${encodeURIComponent(number)}`
            );


          console.log(
            "PAIR RESPONSE:",
            response.data
          );


          if (
            response.data &&
            response.data.success &&
            response.data.code
          ) {

            currentPairCode =
              response.data.code;


            codeDisplay.innerHTML = `
              <div class="success-message">
                <i class="fas fa-check-circle"></i>
                ${currentPairCode}
              </div>
            `;

          } else {

            codeDisplay.innerHTML = `
              <div class="error-message">
                <i class="fas fa-exclamation-circle"></i>
                ${
                  response.data?.error ||
                  "Failed to generate pair code"
                }
              </div>
            `;

          }


        } catch (error) {

          console.error(
            "PAIR ERROR:",
            error
          );


          const errorMessage =
            error.response?.data?.error ||
            "Server error. Please try again.";


          codeDisplay.innerHTML = `
            <div class="error-message">
              <i class="fas fa-exclamation-circle"></i>
              ${errorMessage}
            </div>
          `;


        } finally {

          loading.style.display = "none";

        }

      });


    /* =========================
       QR CODE
    ========================= */

    async function generateQRCode() {

      const codeDisplay =
        document.getElementById("codeDisplay");

      const qrDisplay =
        document.getElementById("qrDisplay");

      const qrImage =
        document.getElementById("qrImage");

      const qrInstructions =
        document.getElementById("qrInstructions");

      const loading =
        document.getElementById("loading");


      loading.style.display = "block";

      codeDisplay.style.display = "none";

      qrDisplay.style.display = "none";


      try {

        const response =
          await axios.get("/qr");


        if (
          response.data &&
          response.data.qr
        ) {

          qrImage.src =
            response.data.qr;


          if (
            Array.isArray(
              response.data.instructions
            )
          ) {

            qrInstructions.innerHTML =
              response.data.instructions
                .join("<br>");

          } else {

            qrInstructions.innerHTML =
              "Scan this QR code with WhatsApp.";

          }


          qrDisplay.style.display =
            "block";


        } else {

          codeDisplay.style.display =
            "flex";


          codeDisplay.innerHTML = `
            <div class="error-message">
              <i class="fas fa-exclamation-circle"></i>
              Failed to generate QR code
            </div>
          `;

        }


      } catch (error) {

        console.error(
          "QR ERROR:",
          error
        );


        codeDisplay.style.display =
          "flex";


        codeDisplay.innerHTML = `
          <div class="error-message">
            <i class="fas fa-exclamation-circle"></i>
            Error generating QR code
          </div>
        `;

      } finally {

        loading.style.display = "none";

      }

    }


    /* =========================
       COPY CODE
    ========================= */

    document
      .getElementById("copy")
      .addEventListener("click", async function () {

        if (!currentPairCode) {

          this.innerHTML = `
            <i class="fas fa-info-circle"></i>
            No Pair Code Available
          `;

          setTimeout(() => {

            this.innerHTML = `
              <i class="fas fa-copy"></i>
              Copy Code
            `;

          }, 1800);

          return;
        }


        try {

          await navigator.clipboard.writeText(
            currentPairCode
          )
