<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>PUTTUS-BOT SESSION</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
  />

  <style>
    :root {
      --gradient-primary: linear-gradient(
        135deg,
        #667eea 0%,
        #764ba2 100%
      );

      --text-color: #f1f1f1;
      --success-color: #4ade80;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family:
        "Inter",
        "SF Pro Display",
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #0f0c29,
          #302b63,
          #24243e
        );

      color: var(--text-color);

      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 15px;
    }

    .container {
      width: 100%;
      max-width: 450px;

      background: rgba(255, 255, 255, 0.025);

      border-radius: 24px;

      padding: 30px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.05);

      backdrop-filter: blur(15px);

      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      width: 80px;
      height: 80px;

      margin: 0 auto 20px;

      background: var(--gradient-primary);

      border-radius: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 32px;

      color: white;

      box-shadow:
        0 10px 30px rgba(102, 126, 234, 0.4);
    }

    .title {
      font-size: 28px;
      font-weight: 800;

      margin-bottom: 8px;

      background: var(--gradient-primary);

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    .subtitle {
      font-size: 14px;

      color: rgba(255, 255, 255, 0.6);

      margin-bottom: 25px;
    }

    .social-icons {
      display: flex;
      justify-content: center;

      gap: 15px;
    }

    .social-icons a {
      width: 46px;
      height: 46px;

      border-radius: 14px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;

      font-size: 18px;

      text-decoration: none;

      background: rgba(255, 255, 255, 0.05);

      border: 1px solid rgba(255, 255, 255, 0.08);

      transition: 0.3s;
    }

    .social-icons a:hover {
      transform: translateY(-3px) scale(1.05);
    }

    .youtube {
      color: #ff0000 !important;
    }

    .telegram {
      color: #0088cc !important;
    }

    .whatsapp {
      color: #25d366 !important;
    }

    .github {
      color: #ffffff !important;
    }

    .toggle-container {
      display: flex;

      background: rgba(255, 255, 255, 0.03);

      border-radius: 16px;

      padding: 4px;

      margin-bottom: 25px;

      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .toggle-option {
      flex: 1;

      padding: 14px 10px;

      text-align: center;

      cursor: pointer;

      border-radius: 12px;

      font-size: 14px;

      font-weight: 600;

      color: rgba(255, 255, 255, 0.5);

      transition: 0.3s;
    }

    .toggle-option.active {
      background: var(--gradient-primary);

      color: white;

      box-shadow:
        0 4px 15px rgba(102, 126, 234, 0.3);
    }

    .input-group {
      margin-bottom: 25px;
    }

    .input-group.hidden {
      display: none;
    }

    .input-label {
      display: block;

      margin-bottom: 10px;

      font-weight: 600;

      font-size: 14px;

      color: rgba(255, 255, 255, 0.8);
    }

    .input-field {
      width: 100%;

      padding: 16px 20px;

      border: 1.5px solid rgba(255, 255, 255, 0.08);

      border-radius: 16px;

      background: rgba(255, 255, 255, 0.03);

      color: white;

      font-size: 15px;

      outline: none;

      transition: 0.3s;
    }

    .input-field:focus {
      border-color: rgba(102, 126, 234, 0.6);

      box-shadow:
        0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .input-field::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .generate-btn {
      width: 100%;

      padding: 18px;

      background: var(--gradient-primary);

      border: none;

      border-radius: 16px;

      color: white;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

      margin-bottom: 20px;

      transition: 0.3s;
    }

    .generate-btn:hover {
      transform: translateY(-2px);

      box-shadow:
        0 15px 40px rgba(102, 126, 234, 0.35);
    }

    .generate-btn.hidden {
      display: none;
    }

    .loading {
      display: none;

      text-align: center;

      margin: 20px 0;
    }

    .loading i {
      font-size: 28px;

      background: var(--gradient-primary);

      -webkit-background-clip: text;

      background-clip: text;

      color: transparent;

      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .code-display {
      background: rgba(255, 255, 255, 0.03);

      padding: 20px;

      border-radius: 16px;

      text-align: center;

      font-size: 18px;

      font-weight: 700;

      margin-bottom: 20px;

      min-height: 60px;

      display: flex;

      align-items: center;
      justify-content: center;

      border: 1px solid rgba(255, 255, 255, 0.08);

      font-family: "Courier New", monospace;

      letter-spacing: 2px;
    }

    .success-message {
      color: var(--success-color);

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 10px;
    }

    .error-message {
      color: #ff6b6b;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      font-size: 14px;

      line-height: 1.5;
    }

    .qr-display {
      display: none;

      background: rgba(255, 255, 255, 0.03);

      padding: 25px;

      border-radius: 16px;

      text-align: center;

      margin-bottom: 20px;

      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .qr-image {
      max-width: 280px;
      width: 100%;

      border-radius: 15px;

      background: white;

      padding: 12px;

      margin-bottom: 15px;
    }

    .qr-instructions {
      font-size: 14px;

      line-height: 1.6;

      color: rgba(255, 255, 255, 0.7);
    }

    .copy-btn {
      width: 100%;

      padding: 16px;

      background: rgba(255, 255, 255, 0.05);

      border: 1px solid rgba(255, 255, 255, 0.08);

      border-radius: 16px;

      color: rgba(255, 255, 255, 0.8);

      font-size: 15px;

      font-weight: 600;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      transition: 0.3s;
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .footer {
      text-align: center;

      margin-top: 25px;

      padding-top: 20px;

      border-top: 1px solid rgba(255, 255, 255, 0.05);

      font-size: 12px;

      color: rgba(255, 255, 255, 0.4);
    }

    @media (max-width: 480px) {
      .container {
        padding: 25px;
      }

      .title {
        font-size: 26px;
      }

      .logo {
        width: 70px;
        height: 70px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- HEADER -->
    <div class="header">

      <div class="logo">
        <i class="fas fa-robot"></i>
      </div>

      <h1 class="title">
        PUTTUS-BOT
      </h1>

      <p class="subtitle">
        Link your WhatsApp device
      </p>

      <!-- SOCIAL -->
      <div class="social-icons">

        <a
          href="https://youtube.com/@puttus-das"
          target="_blank"
          class="youtube"
        >
          <i class="fab fa-youtube"></i>
        </a>

        <a
          href="https://t.me/"
          target="_blank"
          class="telegram"
        >
          <i class="fab fa-telegram"></i>
        </a>

        <a
          href="https://wa.me/"
          target="_blank"
          class="whatsapp"
        >
          <i class="fab fa-whatsapp"></i>
        </a>

        <a
          href="https://github.com/puttus-das/PUTTUS-AI"
          target="_blank"
          class="github"
        >
          <i class="fab fa-github"></i>
        </a>

      </div>

    </div>


    <!-- TOGGLE -->
    <div class="toggle-container">

      <div
        class="toggle-option active"
        data-mode="pair"
      >
        <i class="fas fa-key"></i>
        Pair Code
      </div>

      <div
        class="toggle-option"
        data-mode="qr"
      >
        <i class="fas fa-qrcode"></i>
        QR Code
      </div>

    </div>


    <!-- NUMBER INPUT -->
    <div
      class="input-group"
      id="inputGroup"
    >

      <label class="input-label">
        Enter your WhatsApp number with country code
      </label>

      <input
        type="text"
        id="mobileNumber"
        class="input-field"
        placeholder="+917679218662"
        inputmode="numeric"
        autocomplete="tel"
      />

    </div>


    <!-- GENERATE -->
    <button
      class="generate-btn"
      id="submit"
    >
      <i class="fas fa-key"></i>
      Generate Pair Code
    </button>


    <!-- LOADING -->
    <div
      class="loading"
      id="loading"
    >
      <i class="fas fa-spinner"></i>
    </div>


    <!-- CODE -->
    <div
      class="code-display"
      id="codeDisplay"
    >
      Your pair code will appear here
    </div>


    <!-- QR -->
    <div
      class="qr-display"
      id="qrDisplay"
    >

      <img
        id="qrImage"
        class="qr-image"
        src=""
        alt="QR Code"
      />

      <div
        class="qr-instructions"
        id="qrInstructions"
      >
        Scan this QR code with your WhatsApp app
      </div>

    </div>


    <!-- COPY -->
    <button
      class="copy-btn"
      id="copy"
      onclick="copyCode()"
    >
      <i class="fas fa-copy"></i>
      Copy Code
    </button>


    <!-- FOOTER -->
    <div class="footer">

      <p>
        © 2026 PUTTUS-BOT. All rights reserved.
      </p>

    </div>

  </div>


  <!-- AXIOS -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"
  ></script>


  <script>

    let currentMode = "pair";


    // ==========================================
    // TOGGLE MODE
    // ==========================================

    document
      .querySelectorAll(".toggle-option")
      .forEach((option) => {

        option.addEventListener("click", function () {

          const mode = this.dataset.mode;

          if (mode === currentMode) {
            return;
          }

          currentMode = mode;


          document
            .querySelectorAll(".toggle-option")
            .forEach((opt) => {
              opt.classList.remove("active");
            });


          this.classList.add("active");


          const submitBtn =
            document.getElementById("submit");

          const inputGroup =
            document.getElementById("inputGroup");

          const codeDisplay =
            document.getElementById("codeDisplay");

          const qrDisplay =
            document.getElementById("qrDisplay");


          if (mode === "pair") {

            submitBtn.innerHTML =
              '<i class="fas fa-key"></i> Generate Pair Code';

            submitBtn.classList.remove("hidden");

            inputGroup.classList.remove("hidden");

            qrDisplay.style.display = "none";

            codeDisplay.style.display = "flex";

            codeDisplay.innerHTML =
              "Your pair code will appear here";

          } else {

            submitBtn.classList.add("hidden");

            inputGroup.classList.add("hidden");

            codeDisplay.style.display = "none";

            generateQRCode();

          }

        });

      });


    // ==========================================
    // GENERATE PAIR CODE
    // ==========================================

    document
      .getElementById("submit")
      .addEventListener("click", async function (e) {

        e.preventDefault();


        const mobileNumberInput =
          document.getElementById("mobileNumber");

        const codeDisplay =
          document.getElementById("codeDisplay");

        const qrDisplay =
          document.getElementById("qrDisplay");

        const loadingSpinner =
          document.getElementById("loading");

        const submitBtn =
          document.getElementById("submit");


        const mobileNumber =
          mobileNumberInput.value.trim();


        if (!mobileNumber) {

          codeDisplay.innerHTML =
            '<div class="error-message">' +
            '<i class="fas fa-exclamation-circle"></i>' +
            'Please enter your WhatsApp number' +
            '</div>';

          return;
        }


        const cleanNumber =
          mobileNumber.replace(/[^0-9]/g, "");


        if (cleanNumber.length < 10) {

          codeDisplay.innerHTML =
            '<div class="error-message">' +
            '<i class="fas fa-exclamation-circle"></i>' +
            'Please enter a valid WhatsApp number with country code' +
            '</div>';

          return;
        }


        loadingSpinner.style.display = "block";

        codeDisplay.style.display = "flex";

        qrDisplay.style.display = "none";

        codeDisplay.innerHTML = "";


        submitBtn.disabled = true;

        submitBtn.style.opacity = "0.6";


        try {

          /*
           * IMPORTANT:
           * Pairing API is /code
           *
           * pair.js is mounted with:
           * app.use('/code', pairRouter)
           */

          const response = await axios.get(
            `/code?number=${encodeURIComponent(cleanNumber)}`
          );


          console.log(
            "Pair API response:",
            response.data
          );


          if (
            response.data &&
            response.data.code
          ) {

            const code =
              response.data.code;


            codeDisplay.innerHTML =
              '<div class="success-message">' +
              '<i class="fas fa-check-circle"></i>' +
              '<span>' +
              code +
              '</span>' +
              '</div>';


          } else if (
            response.data &&
            response.data.error
          ) {

            codeDisplay.innerHTML =
              '<div class="error-message">' +
              '<i class="fas fa-exclamation-circle"></i>' +
              '<span>' +
              response.data.error +
              '</span>' +
              '</div>';


          } else {

            codeDisplay.innerHTML =
              '<div class="error-message">' +
              '<i class="fas fa-exclamation-circle"></i>' +
              '<span>Service Unavailable</span>' +
              '</div>';

          }


        } catch (error) {

          console.error(
            "Pair Code Error:",
            error
          );


          let message =
            "Service Unavailable";


          if (
            error.response &&
            error.response.data
          ) {

            if (
              error.response.data.error
            ) {

              message =
                error.response.data.error;

            }

          }


          codeDisplay.innerHTML =
            '<div class="error-message">' +
            '<i class="fas fa-exclamation-circle"></i>' +
            '<span>' +
            message +
            '</span>' +
            '</div>';


        } finally {

          loadingSpinner.style.display =
            "none";

          submitBtn.disabled =
            false;

          submitBtn.style.opacity =
            "1";

        }

      });


    // ==========================================
    // QR CODE
    // ==========================================

    async function generateQRCode() {

      const codeDisplay =
        document.getElementById("codeDisplay");

      const qrDisplay =
        document.getElementById("qrDisplay");

      const loadingSpinner =
        document.getElementById("loading");


      loadingSpinner.style.display =
        "block";


      codeDisplay.style.display =
        "none";


      qrDisplay.style.display =
        "none";


      try {

        const response =
          await axios.get("/qr");


        if (
          response.data &&
          response.data.qr
        ) {

          document.getElementById(
            "qrImage"
          ).src =
            response.data.qr;


          const instructions =
            response.data.instructions;


          if (
            Array.isArray(instructions)
          ) {

            document.getElementById(
              "qrInstructions"
            ).innerHTML =
              instructions.join("<br>");

          } else {

            document.getElementById(
              "qrInstructions"
            ).innerHTML =
              "Scan this QR code with your WhatsApp app";

          }


          qrDisplay.style.display =
            "block";


        } else {

          codeDisplay.style.display =
            "flex";


          codeDisplay.innerHTML =
            '<div class="error-message">' +
            '<i class="fas fa-exclamation-circle"></i>' +
            'Failed to generate QR code' +
            '</div>';

        }


      } catch (error) {

        console.error(
          "QR Error:",
          error
        );


        codeDisplay.style.display =
          "flex";


        codeDisplay.innerHTML =
          '<div class="error-message">' +
          '<i class="fas fa-exclamation-circle"></i>' +
          'Error generating QR code. Please try again.' +
          '</div>';


      } finally {

        loadingSpinner.style.display =
          "none";

      }

    }


    // ==========================================
    // COPY CODE
    // ==========================================

    async function copyCode() {

      const codeDisplay =
        document.getElementById("codeDisplay");


      const text =
        codeDisplay.innerText.trim();


      if (
        !text ||
        text.includes(
          "Your pair code"
        ) ||
        text.includes(
          "Service Unavailable"
        )
      ) {

        return;

      }


      try {

        await navigator.clipboard.writeText(
          text
        );


        const copyBtn =
          document.getElementById("copy");


        copyBtn.innerHTML =
          '<i class="fas fa-check"></i> Copied!';


        setTimeout(() => {

          copyBtn.innerHTML =
            '<i class="fas fa-copy"></i> Copy Code';

        }, 2000);


      } catch (error) {

        console.error(
          "Copy error:",
          error
        );

      }

    }

  </script>

</body>
</html>
