<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PUTTUS-DAS SESSION</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      padding: 15px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #fff;

      background:
        radial-gradient(
          circle at top left,
          rgba(102,126,234,.35),
          transparent 35%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(118,75,162,.35),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #0f0c29,
          #302b63,
          #24243e
        );
    }

    .container {
      width: 100%;
      max-width: 450px;

      padding: 30px;

      border-radius: 25px;

      background: rgba(255,255,255,.035);

      border: 1px solid rgba(255,255,255,.08);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      box-shadow:
        0 25px 70px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.08);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 82px;
      height: 82px;

      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 22px;

      font-size: 34px;

      background:
        linear-gradient(
          135deg,
          #667eea,
          #764ba2
        );

      box-shadow:
        0 15px 40px rgba(102,126,234,.4);
    }

    .title {
      font-size: 29px;
      font-weight: 800;

      background:
        linear-gradient(
          135deg,
          #fff,
          #a5b4fc,
          #c084fc
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      margin-bottom: 7px;
    }

    .subtitle {
      color: rgba(255,255,255,.6);
      font-size: 14px;
    }

    .social-icons {
      display: flex;
      justify-content: center;

      gap: 13px;

      margin-top: 20px;
      margin-bottom: 25px;
    }

    .social-icons a {
      width: 46px;
      height: 46px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 14px;

      text-decoration: none;

      background: rgba(255,255,255,.05);

      border: 1px solid rgba(255,255,255,.08);

      transition: .3s;
    }

    .social-icons a:hover {
      transform: translateY(-4px) scale(1.05);
      background: rgba(255,255,255,.1);
    }

    .youtube {
      color: #ff0000;
    }

    .facebook {
      color: #1877f2;
    }

    .whatsapp {
      color: #25d366;
    }

    .github {
      color: #fff;
    }

    .toggle-container {
      display: flex;

      padding: 5px;

      margin-bottom: 25px;

      border-radius: 16px;

      background: rgba(255,255,255,.035);

      border: 1px solid rgba(255,255,255,.07);
    }

    .toggle-option {
      flex: 1;

      padding: 14px 10px;

      text-align: center;

      border-radius: 12px;

      cursor: pointer;

      font-size: 14px;
      font-weight: 600;

      color: rgba(255,255,255,.5);

      transition: .3s;
    }

    .toggle-option i {
      margin-right: 7px;
    }

    .toggle-option.active {
      color: #fff;

      background:
        linear-gradient(
          135deg,
          #667eea,
          #764ba2
        );

      box-shadow:
        0 5px 18px rgba(102,126,234,.3);
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-label {
      display: block;

      margin-bottom: 9px;

      font-size: 14px;
      font-weight: 600;

      color: rgba(255,255,255,.8);
    }

    .input-field {
      width: 100%;

      padding: 16px 18px;

      border-radius: 15px;

      border: 1px solid rgba(255,255,255,.1);

      background: rgba(255,255,255,.04);

      color: #fff;

      font-size: 15px;

      outline: none;

      transition: .3s;
    }

    .input-field::placeholder {
      color: rgba(255,255,255,.3);
    }

    .input-field:focus {
      border-color: #667eea;

      box-shadow:
        0 0 0 3px rgba(102,126,234,.12);
    }

    .generate-btn {
      width: 100%;

      padding: 17px;

      border: none;
      border-radius: 15px;

      cursor: pointer;

      color: #fff;

      font-size: 15px;
      font-weight: 700;

      background:
        linear-gradient(
          135deg,
          #667eea,
          #764ba2
        );

      box-shadow:
        0 10px 30px rgba(102,126,234,.25);

      transition: .3s;
    }

    .generate-btn:hover {
      transform: translateY(-3px);

      box-shadow:
        0 15px 35px rgba(102,126,234,.4);
    }

    .generate-btn.hidden {
      display: none;
    }

    .loading {
      display: none;

      text-align: center;

      margin: 20px 0;
    }

    .loading i {
      font-size: 28px;

      color: #a5b4fc;

      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .code-display {
      width: 100%;

      min-height: 65px;

      margin-top: 20px;

      padding: 18px;

      display: flex;

      align-items: center;
      justify-content: center;

      text-align: center;

      border-radius: 16px;

      background: rgba(255,255,255,.035);

      border: 1px solid rgba(255,255,255,.08);

      font-family: monospace;

      font-size: 18px;

      letter-spacing: 2px;
    }

    .success-message {
      color: #4ade80;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 10px;

      font-weight: 700;
    }

    .error-message {
      color: #ff6b6b;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 10px;

      font-size: 14px;
    }

    .qr-display {
      display: none;

      margin-top: 20px;

      padding: 25px;

      text-align: center;

      border-radius: 18px;

      background: rgba(255,255,255,.04);

      border: 1px solid rgba(255,255,255,.08);
    }

    .qr-image {
      width: 260px;
      max-width: 100%;

      padding: 12px;

      background: #fff;

      border-radius: 15px;
    }

    .qr-instructions {
      margin-top: 15px;

      color: rgba(255,255,255,.65);

      font-size: 13px;

      line-height: 1.6;
    }

    .copy-btn {
      width: 100%;

      padding: 15px;

      margin-top: 18px;

      border-radius: 15px;

      border: 1px solid rgba(255,255,255,.1);

      background: rgba(255,255,255,.05);

      color: rgba(255,255,255,.85);

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;

      transition: .3s;
    }

    .copy-btn:hover {
      background: rgba(255,255,255,.1);
      transform: translateY(-2px);
    }

    .footer {
      text-align: center;

      margin-top: 25px;
      padding-top: 18px;

      border-top:
        1px solid rgba(255,255,255,.06);

      color: rgba(255,255,255,.35);

      font-size: 11px;
    }

    @media (max-width:480px) {

      .container {
        padding: 24px 20px;
      }

      .logo {
        width: 72px;
        height: 72px;
        font-size: 29px;
      }

      .title {
        font-size: 25px;
      }

    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">

    <div class="logo">
      <i class="fas fa-robot"></i>
    </div>

    <h1 class="title">
      PUTTUS-DAS
    </h1>

    <p class="subtitle">
      Link your WhatsApp device
    </p>

    <div class="social-icons">

      <a
        href="https://youtube.com/@pabitra_paul-31"
        target="_blank"
        class="youtube"
      >
        <i class="fab fa-youtube"></i>
      </a>

      <a
        href="https://www.facebook.com/"
        target="_blank"
        class="facebook"
      >
        <i class="fab fa-facebook"></i>
      </a>

      <a
        href="https://wa.me/"
        target="_blank"
        class="whatsapp"
      >
        <i class="fab fa-whatsapp"></i>
      </a>

      <a
        href="https://github.com/puttus-das/PUTTUS-AI"
        target="_blank"
        class="github"
      >
        <i class="fab fa-github"></i>
      </a>

    </div>

  </div>


  <div class="toggle-container">

    <div
      class="toggle-option active"
      data-mode="pair"
    >
      <i class="fas fa-key"></i>
      Pair Code
    </div>

    <div
      class="toggle-option"
      data-mode="qr"
    >
      <i class="fas fa-qrcode"></i>
      QR Code
    </div>

  </div>


  <div
    class="input-group"
    id="inputGroup"
  >

    <label class="input-label">
      Enter your WhatsApp number with country code
    </label>

    <input
      type="tel"
      id="mobileNumber"
      class="input-field"
      placeholder="+917679218662"
      autocomplete="tel"
    >

  </div>


  <button
    class="generate-btn"
    id="submit"
  >
    <i class="fas fa-key"></i>
    Generate Pair Code
  </button>


  <div
    class="loading"
    id="loading"
  >
    <i class="fas fa-spinner"></i>
  </div>


  <div
    class="code-display"
    id="codeDisplay"
  >
    Your pair code will appear here
  </div>


  <div
    class="qr-display"
    id="qrDisplay"
  >

    <img
      id="qrImage"
      class="qr-image"
      alt="WhatsApp QR Code"
    >

    <div
      id="qrInstructions"
      class="qr-instructions"
    >
      Scan this QR code with WhatsApp.
    </div>

  </div>


  <button
    class="copy-btn"
    id="copy"
  >
    <i class="fas fa-copy"></i>
    Copy Code
  </button>


  <div class="footer">
    © 2026 PUTTUS-BOT. All rights reserved.
  </div>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.8/axios.min.js"></script>

<script>

let currentMode = "pair";
let currentPairCode = "";


/* =========================
   TOGGLE
========================= */

document
.querySelectorAll(".toggle-option")
.forEach(option => {

  option.addEventListener("click", function() {

    const mode = this.dataset.mode;

    if (mode === currentMode) return;

    document
    .querySelectorAll(".toggle-option")
    .forEach(opt => {
      opt.classList.remove("active");
    });

    this.classList.add("active");

    currentMode = mode;

    const inputGroup =
      document.getElementById("inputGroup");

    const submit =
      document.getElementById("submit");

    const codeDisplay =
      document.getElementById("codeDisplay");

    const qrDisplay =
      document.getElementById("qrDisplay");

    currentPairCode = "";

    codeDisplay.innerHTML =
      "Your pair code will appear here";

    codeDisplay.style.display = "flex";

    qrDisplay.style.display = "none";


    if (mode === "pair") {

      inputGroup.style.display = "block";

      submit.classList.remove("hidden");

      submit.innerHTML =
        '<i class="fas fa-key"></i> Generate Pair Code';

    } else {

      inputGroup.style.display = "none";

      submit.classList.add("hidden");

      generateQRCode();

    }

  });

});


/* =========================
   PAIR CODE
========================= */

document
.getElementById("submit")
.addEventListener("click", async function() {

  const input =
    document.getElementById("mobileNumber");

  const codeDisplay =
    document.getElementById("codeDisplay");

  const qrDisplay =
    document.getElementById("qrDisplay");

  const loading =
    document.getElementById("loading");


  let number =
    input.value.trim();

  number =
    number.replace(/[^0-9]/g, "");


  if (!number) {

    codeDisplay.innerHTML = `
      <div class="error-message">
        <i class="fas fa-exclamation-circle"></i>
        Please enter your WhatsApp number
      </div>
    `;

    return;
  }


  if (
    number.length < 10 ||
    number.length > 15
  ) {

    codeDisplay.innerHTML = `
      <div class="error-message">
        <i class="fas fa-exclamation-circle"></i>
        Invalid WhatsApp number
      </div>
    `;

    return;
  }


  loading.style.display = "block";

  qrDisplay.style.display = "none";

  codeDisplay.style.display = "flex";

  codeDisplay.innerHTML = `
    <div>
      <i class="fas fa-spinner fa-spin"></i>
      Generating pairing code...
    </div>
  `;


  try {

    /*
     * IMPORTANT
     *
     * Your PAIRING-WEB backend uses:
     *
     * /code?number=XXXXXXXXXX
     *
     * NOT /pair
     */

    const response =
      await axios.get(
        `/code?number=${encodeURIComponent(number)}`
      );


    console.log(
      "PAIRING RESPONSE:",
      response.data
    );


    /*
     * Backend response:
     *
     * {
     *   code: "XXXX-XXXX"
     * }
     */

    if (
      response.data &&
      response.data.code
    ) {

      currentPairCode =
        response.data.code;


      codeDisplay.innerHTML = `
        <div class="success-message">
          <i class="fas fa-check-circle"></i>
          ${currentPairCode}
        </div>
      `;

    } else {

      codeDisplay.innerHTML = `
        <div class="error-message">
          <i class="fas fa-exclamation-circle"></i>
          ${
            response.data?.error ||
            "Pairing code not received"
          }
        </div>
      `;

    }


  } catch (error) {

    console.error(
      "PAIR ERROR:",
      error
    );


    let message =
      "Unable to generate pairing code";


    if (error.response) {

      message =
        error.response.data?.error ||
        `Server error (${error.response.status})`;

    } else if (error.request) {

      message =
        "Server did not respond";

    }


    codeDisplay.innerHTML = `
      <div class="error-message">
        <i class="fas fa-exclamation-circle"></i>
        ${message}
      </div>
    `;


  } finally {

    loading.style.display = "none";

  }

});


/* =========================
   QR CODE
========================= */

async function generateQRCode() {

  const loading =
    document.getElementById("loading");

  const codeDisplay =
    document.getElementById("codeDisplay");

  const qrDisplay =
    document.getElementById("qrDisplay");

  const qrImage =
    document.getElementById("qrImage");

  const instructions =
    document.getElementById("qrInstructions");


  loading.style.display = "block";

  codeDisplay.style.display = "none";

  qrDisplay.style.display = "none";


  try {

    const response =
      await axios.get("/qr");


    if (
      response.data &&
      response.data.qr
    ) {

      qrImage.src =
        response.data.qr;


      if (
        Array.isArray(
          response.data.instructions
        )
      ) {

        instructions.innerHTML =
          response.data.instructions
          .join("<br>");

      } else {

        instructions.innerHTML =
          "Scan this QR code with WhatsApp.";

      }


      qrDisplay.style.display =
        "block";

    } else {

      codeDisplay.style.display =
        "flex";

      codeDisplay.innerHTML = `
        <div class="error-message">
          <i class="fas fa-exclamation-circle"></i>
          QR code unavailable
        </div>
      `;

    }


  } catch (error) {

    console.error(
      "QR ERROR:",
      error
    );

    codeDisplay.style.display =
      "flex";

    codeDisplay.innerHTML = `
      <div class="error-message">
        <i class="fas fa-exclamation-circle"></i>
        QR service unavailable
      </div>
    `;

  } finally {

    loading.style.display = "none";

  }

}


/* =========================
   COPY
========================= */

document
.getElementById("copy")
.addEventListener("click", async function() {

  if (!currentPairCode) {

    this.innerHTML = `
      <i class="fas fa-info-circle"></i>
      No Pair Code Available
    `;

    setTimeout(() => {

      this.innerHTML = `
        <i class="fas fa-copy"></i>
        Copy Code
      `;

    }, 1800);

    return;
  }


  try {

    await navigator.clipboard.writeText(
      currentPairCode
    );


    this.innerHTML = `
      <i class="fas fa-check"></i>
      Copied!
    `;


    setTimeout(() => {

      this.innerHTML = `
        <i class="fas fa-copy"></i>
        Copy Code
      `;

    }, 2000);


  } catch (error) {

    console.error(
      "COPY ERROR:",
      error
    );

  }

});

</script>

</body>
  </html>
